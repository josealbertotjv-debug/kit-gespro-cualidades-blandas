# =============================================================================
# Kit-GesPro (GP-13) · Nginx reverse proxy (Vultr)
# Copiar a /etc/nginx/sites-available/kit-cualidades-blandas.conf, ajustar server_name,
# enlazar en sites-enabled y emitir certificado:  sudo certbot --nginx -d cualidades.gespro.ejemplo.com
# =============================================================================

limit_req_zone $binary_remote_addr zone=gp13_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cualidades.gespro.ejemplo.com;   # ← CAMBIAR

    client_max_body_size 2m;

    # Certbot reescribirá este bloque para redirigir a HTTPS y añadir el bloque 443.
    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=gp13_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
