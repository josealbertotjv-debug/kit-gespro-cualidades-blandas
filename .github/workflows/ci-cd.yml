# =============================================================================
# Kit-GesPro (GP-13) · CI/CD
#   1. Pruebas con SQLite y con PostgreSQL 16 (esquema kit)
#   2. Imagen Docker → GHCR (ghcr.io/<owner>/kit-gespro-cualidades-blandas)
#   3. Despliegue por SSH al servidor Vultr (opcional: requiere vars.DEPLOY_ENABLED=true + secretos)
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: Pruebas · SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SQLITE_PATH: ${{ runner.temp }}/gp13-ci.db
      - name: Build versión autónoma
        run: npm run build:standalone

  test-postgres:
    name: Pruebas · PostgreSQL 16 (esquema kit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gespro
          POSTGRES_PASSWORD: gespro
          POSTGRES_DB: gespro_costos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gespro -d gespro_costos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gespro:gespro@localhost:5432/gespro_costos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migración (npm run migrate)
        run: npm run migrate
      - name: Pruebas de API sobre PostgreSQL
        run: npm test
      - name: Re-ejecución (migración y semilla idempotentes)
        run: npm run migrate && npm test
      - name: Rol de mínimos privilegios kit_gp13 (deploy/provision-db.sql) en BD nueva
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE gp13_lp"
          for i in 1 2; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -v pw=ci_kit_pw -v dbname=gp13_lp -f deploy/provision-db.sql
          done
          export DATABASE_URL=postgresql://kit_gp13:ci_kit_pw@localhost:5432/gp13_lp
          test "$(psql "$DATABASE_URL" -Atc 'select current_user')" = kit_gp13
          npm run migrate && npm test

  docker:
    name: Imagen Docker → GHCR
    needs: [test-sqlite, test-postgres]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test de la imagen
        run: |
          docker run -d --name gp13 -p 4500:4500 ${{ steps.vars.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4500/healthz && exit 0; sleep 1; done
          docker logs gp13; exit 1

  deploy:
    name: Despliegue · Vultr
    needs: docker
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      # OpenSSH nativo del runner (sin descargar binarios de terceros: evita
      # fallos transitorios de red como "curl: (56) Connection died").
      - name: Desplegar en el servidor (ssh)
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          HOST: ${{ secrets.VULTR_HOST }}
          SSH_USER: ${{ secrets.VULTR_USER || 'root' }}
          SSH_PORT: ${{ secrets.VULTR_SSH_PORT || 22 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/gespro/kit-cualidades-blandas' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5 6; do
            ssh-keyscan -T 10 -p "$SSH_PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && break
            echo "Esperando SSH en el servidor ($i/6)…"; sleep 10
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::No se pudo contactar el servidor por SSH"; exit 1; }
          {
            # Variables enviadas por stdin (no aparecen en la línea de comandos remota).
            printf 'GHCR_USER=%q\nGHCR_TOKEN=%q\nAPP_DIR=%q\n' "$GHCR_USER" "$GHCR_TOKEN" "$APP_DIR"
            cat <<'REMOTE'
          set -e
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          cd "$APP_DIR"
          echo "$GHCR_TOKEN" | $SUDO docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          $SUDO docker compose pull
          $SUDO docker compose up -d --remove-orphans
          APP_PORT=$($SUDO grep -E '^HOST_PORT=' .env | cut -d= -f2 || true)
          APP_PORT=${APP_PORT:-4500}
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/healthz"; then
              echo; $SUDO docker logout ghcr.io >/dev/null 2>&1 || true
              $SUDO docker image prune -f >/dev/null; exit 0
            fi
            sleep 2
          done
          $SUDO docker compose logs --tail 100
          exit 1
          REMOTE
          } | ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                -p "$SSH_PORT" "$SSH_USER@$HOST" 'bash -s'
